<!DOCTYPE html>
<html>

<head>
    <title>Online Shopping - Order Viewer</title>

    <script>
        function loadOrders() {

            var xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function () {

                if (this.readyState == 4 && this.status == 200) {

                    var xml = this.responseXML;
                    var orders = xml.getElementsByTagName("order");

                    var output = "<h2>Order Details</h2>";

                    output += "<table border='1' cellpadding='6'>";

                    output += "<tr>";
                    output += "<th>ID</th>";
                    output += "<th>Customer</th>";
                    output += "<th>Product</th>";
                    output += "<th>Quantity</th>";
                    output += "<th>Price</th>";
                    output += "</tr>";

                    for (var i = 0; i < orders.length; i++) {

                        var o = orders[i];

                        function val(tag) {
                            return o.getElementsByTagName(tag)[0]
                                    .childNodes[0].nodeValue;
                        }

                        var id = val("id");
                        var customer = val("customer");
                        var product = val("product");
                        var quantity = val("quantity");
                        var price = val("price");

                        output += "<tr>";
                        output += "<td>" + id + "</td>";
                        output += "<td>" + customer + "</td>";
                        output += "<td>" + product + "</td>";
                        output += "<td>" + quantity + "</td>";
                        output += "<td>$" + price + "</td>";
                        output += "</tr>";
                    }

                    output += "</table>";

                    document.getElementById("orderData").innerHTML = output;
                }
            };

            xhttp.open("GET", "orders.xml", true);
            xhttp.send();
        }
    </script>

</head>

<body>

    <h1>Online Shopping - Order Viewer</h1>

    <button onclick="loadOrders()">Load Orders</button>

    <div id="orderData"></div>

</body>

</html>
