<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <title>Job Registration Form</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        max-width: 700px;
        margin: auto;
        background-color: white;
        padding: 35px 45px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .section-title {
        margin-top: 25px;
        padding: 10px;
        background-color: #667eea;
        color: white;
        border-radius: 5px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="number"],
    select,
    textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    textarea {
        height: 100px;
        resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }

    .gender {
        margin-top: 10px;
    }

    .gender label {
        display: inline;
        font-weight: normal;
        margin-right: 20px;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .submit-btn,
    .reset-btn {
        width: 50%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .submit-btn {
        background-color: #28a745;
    }

    .submit-btn:hover {
        background-color: #218838;
    }

    .reset-btn {
        background-color: #777;
    }

    .reset-btn:hover {
        background-color: #555;
    }
</style>

</head> <body> <div class="container">
<h1>Job Registration Form</h1>
<p class="subtitle">Enter your details to apply for a job</p>

<form action="register.jsp" method="post">

    <h3 class="section-title">Account Details</h3>

    <label for="username">User Name</label>
    <input type="text" id="username" name="username"
           placeholder="Enter username" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           placeholder="Enter password" required>


    <h3 class="section-title">Personal Details</h3>

    <label for="name">Full Name</label>
    <input type="text" id="name" name="name"
           placeholder="Enter your full name" required>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required>

    <label>Gender</label>
    <div class="gender">
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
    </div>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email"
           placeholder="Enter email address" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone"
           placeholder="Enter phone number" required>

    <label for="address">Address</label>
    <textarea id="address" name="address"
              placeholder="Enter your address" required></textarea>


    <h3 class="section-title">Education & Career</h3>

    <label for="qualification">Highest Qualification</label>
    <select id="qualification" name="qualification" required>
        <option value="">-- Select Qualification --</option>
        <option value="10th">10th</option>
        <option value="12th">12th</option>
        <option value="Diploma">Diploma</option>
        <option value="Bachelors">Bachelor's Degree</option>
        <option value="Masters">Master's Degree</option>
        <option value="PhD">PhD</option>
    </select>

    <label for="specialization">Specialization</label>
    <input type="text" id="specialization" name="specialization"
           placeholder="Example: Computer Science">

    <label for="skills">Skills</label>
    <textarea id="skills" name="skills"
              placeholder="Example: Java, HTML, CSS, SQL"></textarea>

    <label for="experience">Work Experience</label>
    <select id="experience" name="experience" required>
        <option value="">-- Select Experience --</option>
        <option value="Fresher">Fresher</option>
        <option value="1-2 Years">1-2 Years</option>
        <option value="3-5 Years">3-5 Years</option>
        <option value="5-10 Years">5-10 Years</option>
        <option value="10+ Years">10+ Years</option>
    </select>

    <label for="jobrole">Preferred Job Role</label>
    <select id="jobrole" name="jobrole" required>
        <option value="">-- Select Job Role --</option>
        <option value="Software Developer">Software Developer</option>
        <option value="Web Developer">Web Developer</option>
        <option value="Data Analyst">Data Analyst</option>
        <option value="Database Administrator">Database Administrator</option>
        <option value="Tester">Software Tester</option>
        <option value="HR">HR</option>
        <option value="Other">Other</option>
    </select>

    <label for="salary">Expected Salary</label>
    <input type="number" id="salary" name="salary"
           placeholder="Enter expected salary">

    <label for="resume">Resume</label>
    <input type="file" id="resume" name="resume">


    <h3 class="section-title">Other Details</h3>

    <label for="location">Preferred Job Location</label>
    <input type="text" id="location" name="location"
           placeholder="Example: Chennai">

    <label for="linkedin">LinkedIn Profile</label>
    <input type="text" id="linkedin" name="linkedin"
           placeholder="Enter LinkedIn profile URL">

    <div class="buttons">
        <input type="submit" value="Submit Application"
               class="submit-btn">

        <input type="reset" value="Clear"
               class="reset-btn">
    </div>

</form>

</div> </body> </html>
