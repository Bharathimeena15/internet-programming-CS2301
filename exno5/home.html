<!DOCTYPE html>

<html>
<head>


<title>Online Examination - Home</title>

<style>

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #e8f0f7;
    }

    .header {
        background-color: #174a75;
        color: white;
        text-align: center;
        padding: 25px;
    }

    .header h1 {
        margin: 0;
        font-family: Georgia, serif;
    }

    .header p {
        margin-top: 8px;
    }

    .container {
        width: 450px;
        margin: 50px auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    h2 {
        text-align: center;
        color: #174a75;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 10px;
        margin-top: 7px;
        border: 1px solid #aaa;
        border-radius: 5px;
        font-size: 14px;
    }

    input:focus,
    select:focus {
        border-color: #174a75;
        outline: none;
    }

    .error {
        color: red;
        font-size: 12px;
        margin-top: 5px;
    }

    .start-button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background-color: #174a75;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    .start-button:hover {
        background-color: #0d3658;
    }

    .footer {
        text-align: center;
        color: #777;
        font-size: 12px;
        margin-top: 20px;
    }

</style>


</head>

<body>


<div class="header">

    <h1>ONLINE EXAMINATION SYSTEM</h1>

    <p>Welcome to the Online Examination Portal</p>

</div>


<div class="container">

    <h2>Student Details</h2>


    <form onsubmit="return validateForm()">


        <!-- NAME -->

        <label>
            Student Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <div id="nameError" class="error"></div>


        <!-- REGISTER NUMBER -->

        <label>
            Registration Number
        </label>

        <input
            type="text"
            id="regno"
            placeholder="Enter registration number"
        >

        <div id="regError" class="error"></div>


        <!-- EMAIL -->

        <label>
            Email Address
        </label>

        <input
            type="text"
            id="email"
            placeholder="Enter your email"
        >

        <div id="emailError" class="error"></div>


        <!-- EXAM -->

        <label>
            Select Examination
        </label>

        <select id="exam">

            <option value="">
                -- Select Exam --
            </option>

            <option value="computer">
                Computer Science
            </option>

            <option value="programming">
                Programming Fundamentals
            </option>

            <option value="database">
                Database Management
            </option>

        </select>

        <div id="examError" class="error"></div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="start-button">

            Start Examination

        </button>


    </form>




</div>


<script>

    function validateForm() {

        var name =
            document.getElementById("name").value.trim();

        var regno =
            document.getElementById("regno").value.trim();

        var email =
            document.getElementById("email").value.trim();

        var exam =
            document.getElementById("exam").value;


        var valid = true;


        /* CLEAR OLD ERRORS */

        document.getElementById("nameError").innerHTML = "";

        document.getElementById("regError").innerHTML = "";

        document.getElementById("emailError").innerHTML = "";

        document.getElementById("examError").innerHTML = "";


        /* NAME VALIDATION */

        if (name == "") {

            document.getElementById("nameError").innerHTML =
                "Please enter your name.";

            valid = false;

        }
        else if (!/^[A-Za-z ]+$/.test(name)) {

            document.getElementById("nameError").innerHTML =
                "Name should contain only letters.";

            valid = false;

        }


        /* REGISTRATION NUMBER */

        if (regno == "") {

            document.getElementById("regError").innerHTML =
                "Please enter your registration number.";

            valid = false;

        }
        else if (!/^[0-9]+$/.test(regno)) {

            document.getElementById("regError").innerHTML =
                "Registration number should contain only numbers.";

            valid = false;

        }


        /* EMAIL VALIDATION */

        if (email == "") {

            document.getElementById("emailError").innerHTML =
                "Please enter your email.";

            valid = false;

        }
        else if (
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
        ) {

            document.getElementById("emailError").innerHTML =
                "Please enter a valid email address.";

            valid = false;

        }


        /* EXAM VALIDATION */

        if (exam == "") {

            document.getElementById("examError").innerHTML =
                "Please select an examination.";

            valid = false;

        }


        /* IF VALID */

        if (valid) {

            alert("Validation successful! Starting examination.");

            window.location.href = "exam.html";

        }


        return false;

    }

</script>


</body>
</html>
